url: https://valentinalinares.github.io/empleR/

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#2C7FB8"

lang: es

home:
  title: empleR
  description: >
    Herramientas para descargar, armonizar y analizar encuestas laborales
    peruanas, con indicadores de empleo, ocupaciones y exposicion a IA.

navbar:
  structure:
    left: [intro, manual, reference, articles]
    right: [search, github]
  components:
    manual:
      text: Manual
      href: articles/funciones.html

reference:
  - title: Descarga y catalogo
    contents:
      - catalogo
      - descargar
      - etiquetar
  - title: Ocupaciones e indicadores
    contents:
      - cno
      - indicadores
      - resumen_nacional
      - ia_exposicion
      - cobertura
  - title: Visualizacion
    contents:
      - mapa
  - title: Datos incluidos
    contents:
      - muestra_epen_2024
      - cno_2015
      - equivalencia_cno
      - co_1995
      - equivalencia_co95
      - indice_ia
      - catalogo_fuentes
      - indicadores_epen
      - url_catalog_epen
      - shapes_departamentos
      - shapes_provincias

articles:
  - title: Empezar
    navbar: Empezar
    contents:
      - empleR
  - title: Manual de empleR
    navbar: Manual
    contents:
      - funciones
      - manual-datos
      - manual-ocupaciones-ia
      - manual-indicadores-mapas
  - title: Contexto
    navbar: Guias
    contents:
      - contexto-encuestas

# panel() se retiro en la version 0.1.0; las paginas antiguas llevan a NEWS.
redirects:
  - ["reference/panel.html", "news/index.html"]
  - ["articles/manual-panel.html", "news/index.html"]
