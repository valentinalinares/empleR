name: pkgcheck

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgcheck
          needs: check

      - name: Run pkgcheck
        run: |
          check <- pkgcheck::pkgcheck(".")
          print(check)

          report <- pkgcheck::checks_to_markdown(check, render = FALSE)
          report <- as.character(unlist(report, use.names = FALSE))
          writeLines(report, "pkgcheck-full.md")

          separators <- grep("^---[[:space:]]*$", report)
          summary_end <- if (length(separators)) {
            separators[[1L]] - 1L
          } else {
            length(report)
          }
          summary <- report[seq_len(max(0L, summary_end))]
          writeLines(summary, Sys.getenv("GITHUB_STEP_SUMMARY"))

          failures <- grep(
            "^- :heavy_multiplication_x:",
            summary,
            value = TRUE
          )
          if (length(failures)) {
            stop(
              "pkgcheck encontró requisitos incumplidos:\n",
              paste(failures, collapse = "\n"),
              call. = FALSE
            )
          }
        shell: Rscript {0}

      - name: Upload full pkgcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pkgcheck-report
          path: pkgcheck-full.md
          if-no-files-found: warn
