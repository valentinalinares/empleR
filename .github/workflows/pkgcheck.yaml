name: pkgcheck

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    # La fase 7 agregara CONTRIBUTING y convertira este control en bloqueante.
    # Mientras tanto se conserva el informe completo sin confundir ese
    # requisito editorial conocido con una regresion funcional.
    continue-on-error: true
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@main
        with:
          post-to-issue: false
